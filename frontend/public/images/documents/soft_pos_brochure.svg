<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" rx="24" fill="#E5F5EE"/>
  <rect x="24" y="24" width="752" height="552" rx="20" fill="white" stroke="#00A36D" stroke-width="2"/>
  
  {/* Header Bar */}
  <rect x="48" y="48" width="704" height="80" rx="16" fill="#00A36D"/>
  <text x="80" y="95" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="26" fill="white">ADDIS MERCHANT SOFT POS</text>
  <text x="80" y="118" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="14" fill="#E5F5EE">Mobile Point-of-Sale &amp; Contactless NFC Setup Brochure</text>

  {/* Smartphone Mockup Vector */}
  <rect x="80" y="160" width="220" height="360" rx="28" fill="#101828"/>
  <rect x="90" y="175" width="200" height="330" rx="20" fill="#F8FDFB"/>
  <circle cx="190" cy="188" r="4" fill="#101828"/>
  
  {/* Phone Screen Card */}
  <rect x="105" y="210" width="170" height="90" rx="14" fill="#00A36D"/>
  <text x="120" y="235" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="10" fill="#E5F5EE">TOTAL COLLECTED</text>
  <text x="120" y="260" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="18" fill="white">ETB 12,450.00</text>
  
  {/* Phone QR Code Mockup */}
  <rect x="145" y="320" width="90" height="90" rx="10" fill="white" stroke="#E5F5EE" stroke-width="2"/>
  <rect x="155" y="330" width="25" height="25" fill="#101828"/>
  <rect x="195" y="330" width="25" height="25" fill="#101828"/>
  <rect x="155" y="370" width="25" height="25" fill="#101828"/>
  <rect x="185" y="365" width="15" height="15" fill="#00A36D"/>
  <text x="190" y="430" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="10" fill="#00A36D">SCAN TO PAY</text>

  {/* Right Features List */}
  <text x="340" y="190" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="20" fill="#101828">Key Soft POS Capabilities</text>

  <circle cx="355" cy="235" r="10" fill="#00A36D"/>
  <path d="M351 235L354 238L360 231" stroke="white" stroke-width="2"/>
  <text x="375" y="240" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#101828">NFC Contactless &amp; QR Code Payments</text>
  <text x="375" y="258" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#6A7282">Accept Telebirr, CBE Birr, and contactless cards on Android.</text>

  <circle cx="355" cy="305" r="10" fill="#00A36D"/>
  <path d="M351 305L354 308L360 301" stroke="white" stroke-width="2"/>
  <text x="375" y="310" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#101828">Digital Receipts &amp; SMS Confirmation</text>
  <text x="375" y="328" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#6A7282">Instant receipt delivery via SMS, Telegram, or email.</text>

  <circle cx="355" cy="375" r="10" fill="#00A36D"/>
  <path d="M351 375L354 378L360 371" stroke="white" stroke-width="2"/>
  <text x="375" y="380" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="14" fill="#101828">Cashier Roles &amp; Multi-Branch Control</text>
  <text x="375" y="398" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#6A7282">Track shift balances and prevent fraud across store branches.</text>

  {/* Bottom Banner */}
  <rect x="340" y="445" width="410" height="75" rx="14" fill="#F8FDFB" stroke="#00A36D" stroke-dasharray="4 2"/>
  <text x="360" y="475" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="13" fill="#00A36D">Download directly on Google Play Store:</text>
  <text x="360" y="498" font-family="Plus Jakarta Sans, sans-serif" font-weight="700" font-size="12" fill="#101828">play.google.com/store/apps/details?id=com.addispay.merchant</text>
