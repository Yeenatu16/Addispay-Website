  {/* Code Snippet Box */}
  <rect x="48" y="130" width="704" height="280" rx="16" fill="#0D131F"/>
  <text x="75" y="170" font-family="monospace" font-size="14" fill="#6A7282">// Initialize Addispay Payment Gateway</text>
  <text x="75" y="200" font-family="monospace" font-size="14" fill="#F5A414">const</text>
  <text x="125" y="200" font-family="monospace" font-size="14" fill="#E5F5EE">addispay =</text>
  <text x="215" y="200" font-family="monospace" font-size="14" fill="#F5A414">new</text>
  <text x="250" y="200" font-family="monospace" font-size="14" fill="#00A36D">AddispayClient</text>
  <text x="375" y="200" font-family="monospace" font-size="14" fill="#E5F5EE">({</text>

  <text x="105" y="230" font-family="monospace" font-size="14" fill="#93C5FD">appId:</text>
  <text x="165" y="230" font-family="monospace" font-size="14" fill="#34D399">"AP-MERCHANT-894210"</text>

  <text x="105" y="260" font-family="monospace" font-size="14" fill="#93C5FD">secretKey:</text>
  <text x="195" y="260" font-family="monospace" font-size="14" fill="#34D399">"sec_uat_984210_live_key"</text>

  <text x="105" y="290" font-family="monospace" font-size="14" fill="#93C5FD">environment:</text>
  <text x="215" y="290" font-family="monospace" font-size="14" fill="#FBBF24">"PRODUCTION"</text>

  <text x="75" y="320" font-family="monospace" font-size="14" fill="#E5F5EE">});</text>

  <text x="75" y="360" font-family="monospace" font-size="14" fill="#6A7282">// Create Hosted Checkout Session</text>
  <text x="75" y="385" font-family="monospace" font-size="14" fill="#F5A414">const</text>
  <text x="125" y="385" font-family="monospace" font-size="14" fill="#E5F5EE">session =</text>
  <text x="210" y="385" font-family="monospace" font-size="14" fill="#F5A414">await</text>
  <text x="260" y="385" font-family="monospace" font-size="14" fill="#00A36D">addispay.checkout.createSession</text>
  <text x="530" y="385" font-family="monospace" font-size="14" fill="#E5F5EE">({ amount: 1500 });</text>

